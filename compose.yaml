# Start everything with one command:  docker compose up --build
#   Spring MVC  -> http://localhost:8080
#   WebFlux     -> http://localhost:8081
services:
  mvc-streaming:
    build:
      context: .
      dockerfile: mvc-streaming/Dockerfile
    image: common-example-module/mvc-streaming
    ports:
      - "8080:8080"

  webflux-streaming:
    build:
      context: .
      dockerfile: webflux-streaming/Dockerfile
    image: common-example-module/webflux-streaming
    ports:
      - "8081:8081"
