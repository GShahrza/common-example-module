name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Docker images build
        run: docker compose build
      - name: Docker image build (spring-ai)
        run: docker build -f spring-ai/Dockerfile .
      - name: Docker image build (kafka-events)
        run: docker build -f kafka-events/Dockerfile .
      - name: Docker image build (spring-batch)
        run: docker build -f spring-batch/Dockerfile .
